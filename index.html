<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#EDEFF3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121419" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<meta name="description" content="Cineteca: cerca film e attori, trame, cast e filmografie (dati TMDb). Installabile come app.">
<title>Cineteca</title>

<!-- ===== PWA: manifest + icone ===== -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">

<!-- ===== iOS / Safari: installazione + standalone ===== -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Cineteca">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">

<!-- ===== Android Chrome ===== -->
<meta name="application-name" content="Cineteca">
<meta name="format-detection" content="telephone=no">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  :root{
    --bg:#EDEFF3;
    --surface:#FFFFFF;
    --surface-2:#E2E5EB;
    --ink:#1A1D26;
    --muted:#5D6372;
    --line:#D3D7DF;
    --accent:#2F45D8;
    --accent-ink:#FFFFFF;
    --accent-soft:#DEE3FF;
    --gold:#B07A00;
    --danger:#C42B3A;
    --shadow:0 1px 2px rgba(26,29,38,.08),0 8px 24px rgba(26,29,38,.10);
    --display:'Bricolage Grotesque',system-ui,sans-serif;
    --text:'Instrument Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
    --r-poster:10px;
    --r-control:999px;
    --r-sheet:20px;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#121419;
      --surface:#1B1E26;
      --surface-2:#262A34;
      --ink:#ECEEF3;
      --muted:#9AA0AD;
      --line:#2D313C;
      --accent:#8E9CFF;
      --accent-ink:#0E1330;
      --accent-soft:#252C55;
      --gold:#F2B226;
      --danger:#FF7A86;
      --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.45);
    }
  }

  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:var(--text);
    font-size:16px;
    line-height:1.5;
    padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
    overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
  }
  body.locked{overflow:hidden}
  button{font:inherit;color:inherit}
  :focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:6px}

  /* ===== header ===== */
  header{
    position:sticky;top:0;z-index:10;
    background:color-mix(in srgb,var(--bg) 86%,transparent);
    backdrop-filter:saturate(1.4) blur(14px);
    -webkit-backdrop-filter:saturate(1.4) blur(14px);
    border-bottom:1px solid transparent;
    transition:border-color .2s;
  }
  header.scrolled{border-bottom-color:var(--line)}
  .hwrap{max-width:1180px;margin:0 auto;padding:18px 20px 14px}
  .brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
  h1{
    font-family:var(--display);font-weight:800;
    font-size:clamp(28px,4.2vw,40px);letter-spacing:-.03em;line-height:1;
  }
  .sub{font-size:13px;color:var(--muted)}

  .searchbar{display:flex;gap:10px;margin-top:16px;align-items:center;flex-wrap:wrap}
  .field{
    flex:1 1 280px;display:flex;align-items:center;gap:10px;
    background:var(--surface);border:1px solid var(--line);
    border-radius:var(--r-control);padding:0 18px;
    transition:border-color .15s,box-shadow .15s;
  }
  .field:focus-within{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
  .field svg{flex:0 0 18px;color:var(--muted)}
  input{
    background:transparent;border:0;outline:0;color:var(--ink);
    font-family:var(--text);font-size:16px;width:100%;padding:13px 0;
  }
  input::placeholder{color:var(--muted)}
  input[type=search]::-webkit-search-cancel-button{cursor:pointer}

  .toggle{
    display:flex;background:var(--surface-2);border-radius:var(--r-control);padding:4px;
  }
  .toggle button{
    background:transparent;border:0;color:var(--muted);font-weight:600;font-size:14px;
    padding:9px 18px;border-radius:var(--r-control);cursor:pointer;min-height:40px;
    transition:background .15s,color .15s;
  }
  .toggle button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}

  .clearkey{
    background:none;border:0;color:var(--muted);font-size:13px;cursor:pointer;
    text-decoration:underline;text-underline-offset:3px;padding:6px 4px;
  }
  .clearkey:hover{color:var(--ink)}

  /* ===== setup chiave ===== */
  .setup{
    max-width:560px;margin:28px auto 0;background:var(--surface);
    border-radius:var(--r-sheet);padding:28px;box-shadow:var(--shadow);
  }
  .setup h2{font-family:var(--display);font-size:24px;font-weight:700;letter-spacing:-.02em;margin-bottom:10px}
  .setup p{color:var(--muted);margin-bottom:16px}
  .setup a{color:var(--accent);font-weight:600}
  .setup label{display:block;font-size:14px;font-weight:600;margin-bottom:6px}
  .setup input{
    border:1px solid var(--line);background:var(--bg);border-radius:12px;
    padding:12px 14px;margin-bottom:16px;
  }
  .setup input:focus{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}

  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    background:var(--accent);color:var(--accent-ink);border:0;
    border-radius:var(--r-control);padding:12px 22px;font-weight:600;font-size:15px;
    cursor:pointer;min-height:46px;transition:filter .15s,transform .1s;
  }
  .btn:hover{filter:brightness(1.08)}
  .btn:active{transform:scale(.98)}
  .btn.ghost{background:transparent;color:var(--muted)}

  /* ===== risultati ===== */
  main{max-width:1180px;margin:0 auto;padding:8px 20px 80px}
  .status{color:var(--muted);font-size:14px;padding:10px 0 4px;min-height:1.5em}
  .status .err{color:var(--danger);font-weight:500}
  .heading{
    font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:-.02em;
    margin:8px 0 4px;
  }

  .grid{
    display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
    gap:28px 18px;margin-top:12px;
  }
  .card{
    display:flex;flex-direction:column;gap:10px;text-align:left;
    background:none;border:0;padding:0;cursor:pointer;
    -webkit-tap-highlight-color:transparent;touch-action:manipulation;
  }
  .poster{
    position:relative;aspect-ratio:2/3;border-radius:var(--r-poster);overflow:hidden;
    background:var(--surface-2) center/cover no-repeat;
    box-shadow:0 1px 2px rgba(0,0,0,.08);
    transition:transform .2s ease,box-shadow .2s ease;
  }
  .card:hover .poster,.card:focus-visible .poster{transform:translateY(-4px);box-shadow:var(--shadow)}
  .card:focus-visible{outline:none}
  .card:focus-visible .poster{outline:2px solid var(--accent);outline-offset:3px}
  .noimg{
    display:flex;align-items:center;justify-content:center;height:100%;
    padding:14px;text-align:center;color:var(--muted);
    font-family:var(--display);font-weight:700;font-size:15px;line-height:1.2;
  }
  .badge{
    position:absolute;top:8px;left:8px;
    background:rgba(18,20,25,.78);color:#fff;
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    font-size:12px;font-weight:600;padding:3px 8px;border-radius:999px;
    display:flex;align-items:center;gap:4px;
  }
  .badge svg{color:#F2B226}
  .card .t{
    font-weight:600;font-size:15px;line-height:1.3;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  }
  .card .y{font-size:13px;color:var(--muted);margin-top:2px;
    display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}

  /* skeleton */
  .sk .poster{animation:pulse 1.2s ease-in-out infinite}
  .sk .line{height:12px;border-radius:6px;background:var(--surface-2);width:80%;animation:pulse 1.2s ease-in-out infinite}
  .sk .line.short{width:40%;margin-top:6px}
  @keyframes pulse{50%{opacity:.55}}

  /* ===== scheda dettaglio ===== */
  .overlay{
    position:fixed;inset:0;z-index:50;display:none;overflow-y:auto;
    background:rgba(10,12,18,.55);
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    overscroll-behavior:contain;
  }
  .overlay.open{display:block}
  .detail{
    position:relative;max-width:960px;margin:32px auto;min-height:60vh;
    background:var(--bg);border-radius:var(--r-sheet);overflow:hidden;
    box-shadow:0 30px 80px rgba(0,0,0,.35);
    animation:sheetIn .28s cubic-bezier(.2,.8,.2,1);
  }
  @keyframes sheetIn{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}

  .back{
    position:absolute;top:16px;left:16px;z-index:3;
    width:44px;height:44px;border-radius:50%;border:0;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    background:rgba(18,20,25,.6);color:#fff;
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  }
  .back:hover{background:rgba(18,20,25,.8)}

  .hero{
    position:relative;height:min(46vw,400px);min-height:220px;
    background:var(--surface-2) center 25%/cover no-repeat;
  }
  .hero::after{
    content:"";position:absolute;inset:0;
    background:linear-gradient(180deg,rgba(0,0,0,.25) 0%,transparent 35%,var(--bg) 100%);
  }
  .hero.plain{height:120px;min-height:0;background:var(--accent-soft)}

  .dhead{
    position:relative;z-index:2;display:flex;gap:28px;align-items:flex-end;
    padding:0 32px;margin-top:-140px;
  }
  .hero.plain + .dhead{margin-top:-60px}
  .dhead .poster{flex:0 0 200px;box-shadow:var(--shadow);border-radius:14px}
  .dhead .poster.round{flex-basis:180px;aspect-ratio:1;border-radius:50%}
  .dinfo{flex:1;min-width:0;padding-bottom:6px}
  .dinfo h2{
    font-family:var(--display);font-weight:800;letter-spacing:-.03em;
    font-size:clamp(28px,4.4vw,46px);line-height:1.02;
    text-wrap:balance;
  }
  .orig{color:var(--muted);font-size:14px;margin-top:6px}
  .facts{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:14px;font-size:15px;color:var(--muted)}
  .facts b{color:var(--ink);font-weight:600}
  .rating{display:inline-flex;align-items:center;gap:5px;color:var(--ink);font-weight:600}
  .rating svg{color:var(--gold)}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
  .chip{background:var(--surface-2);color:var(--ink);font-size:13px;font-weight:500;padding:5px 12px;border-radius:999px}

  .dbody{padding:28px 32px 40px}
  .dbody h3{
    font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:-.02em;
    margin:30px 0 12px;
  }
  .dbody h3:first-child{margin-top:0}
  .plot{font-size:16px;line-height:1.65;max-width:68ch}
  .director{margin-top:14px;font-size:15px;color:var(--muted)}
  .director b{color:var(--ink);font-weight:600}

  /* cast: scorrimento orizzontale */
  .cast{
    display:grid;grid-auto-flow:column;grid-auto-columns:120px;gap:16px;
    overflow-x:auto;padding:4px 32px 12px;margin:0 -32px;
    scroll-snap-type:x proximity;scrollbar-width:thin;
  }
  .actor{
    scroll-snap-align:start;background:none;border:0;padding:0;text-align:left;cursor:pointer;
    display:flex;flex-direction:column;justify-content:flex-start;
  }
  .actor .ph{
    aspect-ratio:1;border-radius:50%;background:var(--surface-2) center 20%/cover no-repeat;
    margin-bottom:8px;transition:transform .2s;
  }
  .actor:hover .ph{transform:scale(1.04)}
  .actor .ph .noimg{font-size:26px}
  .actor .an{font-size:14px;font-weight:600;line-height:1.25}
  .actor .ac{font-size:13px;color:var(--muted);line-height:1.25;margin-top:2px}

  .dbody .grid{grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:22px 14px}

  /* ===== PWA: install banner + update toast ===== */
  .install-bar{
    position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:60;
    max-width:560px;margin:0 auto;
    background:var(--surface);border-radius:18px;box-shadow:var(--shadow);
    padding:14px 14px 14px 16px;display:none;
  }
  .install-bar.show{display:flex;gap:12px;align-items:center;animation:sheetIn .3s ease}
  .install-bar img{width:44px;height:44px;border-radius:11px;flex:0 0 44px}
  .install-bar .msg{flex:1;font-size:14px;color:var(--muted);line-height:1.35}
  .install-bar .msg b{color:var(--ink);display:block}
  .install-bar .share{display:inline-block;width:16px;height:16px;vertical-align:-3px;color:var(--accent)}
  .install-bar .btn{min-height:40px;padding:8px 16px;font-size:14px}
  .install-bar .x{
    background:none;border:0;color:var(--muted);cursor:pointer;
    width:36px;height:36px;border-radius:50%;font-size:20px;line-height:1;
  }
  .install-bar .x:hover{background:var(--surface-2)}

  .update-toast{
    position:fixed;left:50%;transform:translateX(-50%);
    top:calc(12px + env(safe-area-inset-top));z-index:70;
    background:var(--ink);color:var(--bg);border-radius:999px;
    padding:8px 8px 8px 18px;font-size:14px;display:none;align-items:center;gap:12px;
    box-shadow:var(--shadow);white-space:nowrap;
  }
  .update-toast.show{display:flex}
  .update-toast .btn{min-height:34px;padding:6px 14px;font-size:13px}

  /* ===== mobile ===== */
  @media (max-width:640px){
    .hwrap{padding:14px 16px 12px}
    .sub{display:none}
    .searchbar{gap:8px}
    .field{flex-basis:100%}
    .toggle{flex:1 1 auto}
    .toggle button{flex:1}
    main{padding:4px 16px 110px}
    .grid{grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:20px 12px}
    .card .t{font-size:14px}
    .card .y{font-size:12px}
    .detail{margin:0;border-radius:0;min-height:100%}
    .back{top:calc(12px + env(safe-area-inset-top));left:12px}
    .hero{height:56vw;min-height:200px}
    .dhead{flex-direction:column;align-items:flex-start;gap:16px;padding:0 16px;margin-top:-110px}
    .dhead .poster{flex:none;width:130px}
    .dhead .poster.round{width:130px}
    .dbody{padding:20px 16px 60px}
    .cast{padding:4px 16px 12px;margin:0 -16px;grid-auto-columns:100px}
    .dbody .grid{grid-template-columns:repeat(auto-fill,minmax(100px,1fr))}
    .setup{margin-top:16px;padding:22px}
  }

  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation:none!important;transition:none!important}
  }
</style>
</head>
<body>
<div id="app">
<header id="top">
  <div class="hwrap">
    <div class="brand">
      <h1>Cineteca</h1>
      <span class="sub">Dati da TMDb</span>
    </div>

    <div id="bar" class="searchbar" style="display:none">
      <label class="field">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="Cerca un film per titolo" autocomplete="off" enterkeyhint="search" aria-label="Cerca">
      </label>
      <div class="toggle" role="group" aria-label="Tipo di ricerca">
        <button id="mFilm" class="on" type="button" aria-pressed="true">Film</button>
        <button id="mActor" type="button" aria-pressed="false">Attori</button>
      </div>
      <button id="clearKey" class="clearkey" type="button">Cambia API key</button>
    </div>
  </div>
</header>

<main>
  <section id="setup" class="setup" style="display:none" aria-labelledby="setupTitle">
    <h2 id="setupTitle">Collega il tuo account TMDb</h2>
    <p>Per cercare film serve una API key gratuita di TMDb. Creala su
      <a href="https://www.themoviedb.org/settings/api" target="_blank" rel="noopener">themoviedb.org/settings/api</a>
      e copia il valore “API Key (v3 auth)”. La chiave resta salvata solo su questo dispositivo.</p>
    <label for="keyInput">API key v3</label>
    <input id="keyInput" type="text" placeholder="Incolla qui la chiave" autocomplete="off" spellcheck="false">
    <button id="saveKey" class="btn" type="button">Salva e inizia</button>
  </section>

  <div id="status" class="status" aria-live="polite"></div>
  <div id="grid" class="grid"></div>
</main>

<div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-label="Scheda"><div id="detail" class="detail"></div></div>

<!-- ===== PWA: banner installazione ===== -->
<div id="installBar" class="install-bar" role="dialog" aria-label="Installa Cineteca">
  <img src="icons/icon-192.png" alt="">
  <div class="msg" id="installMsg"></div>
  <button id="installBtn" class="btn" type="button">Installa</button>
  <button id="installDismiss" class="x" type="button" aria-label="Chiudi">×</button>
</div>

<!-- ===== PWA: nuova versione disponibile ===== -->
<div id="updateToast" class="update-toast" role="status" aria-live="polite">
  <span>È disponibile una nuova versione</span>
  <button id="updateBtn" class="btn" type="button">Aggiorna</button>
</div>
</div>

<script>
const IMG="https://image.tmdb.org/t/p/";
const KEY_LS="tmdb_key";
let apiKey=localStorage.getItem(KEY_LS)||"";
let mode="film";          // 'film' | 'actor'
let debounce=null;
let searchSeq=0;

const $=id=>document.getElementById(id);
const setup=$("setup"),bar=$("bar"),status=$("status"),grid=$("grid"),
      overlay=$("overlay"),detail=$("detail");

const ICON_STAR='<svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.3l-5.9 3.3 1.3-6.6L2.5 9.4l6.6-.8z"/></svg>';
const ICON_BACK='<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>';

/* ---------- API ---------- */
async function api(path,params={}){
  const u=new URL("https://api.themoviedb.org/3/"+path);
  u.searchParams.set("api_key",apiKey);
  u.searchParams.set("language","it-IT");
  Object.entries(params).forEach(([k,v])=>u.searchParams.set(k,v));
  const r=await fetch(u);
  if(!r.ok) throw new Error(r.status===401?"API key non valida. Usa “Cambia API key” per inserirne una nuova.":"Il server TMDb ha risposto con errore "+r.status+".");
  return r.json();
}

/* ---------- ricerca ---------- */
function skeleton(n=12){
  grid.innerHTML=Array.from({length:n},()=>
    '<div class="card sk" aria-hidden="true"><div class="poster"></div><div><div class="line"></div><div class="line short"></div></div></div>').join("");
}

async function search(term){
  term=term.trim();
  const seq=++searchSeq;
  if(!term){loadTrending();return;}
  status.textContent="";
  skeleton();
  try{
    if(mode==="film"){
      const d=await api("search/movie",{query:term,include_adult:false});
      if(seq===searchSeq) renderFilms(d.results||[]);
    }else{
      const d=await api("search/person",{query:term,include_adult:false});
      if(seq===searchSeq) renderActors(d.results||[]);
    }
  }catch(e){
    if(seq!==searchSeq) return;
    grid.innerHTML="";
    status.innerHTML='<span class="err">'+esc(e.message)+'</span>';
  }
}

async function loadTrending(){
  const seq=++searchSeq;
  status.innerHTML='<h2 class="heading">In tendenza questa settimana</h2>';
  skeleton();
  try{
    const d=await api("trending/movie/week");
    if(seq!==searchSeq) return;
    grid.innerHTML="";
    (d.results||[]).forEach(m=>grid.appendChild(filmCard(m)));
  }catch(e){
    if(seq!==searchSeq) return;
    grid.innerHTML="";
    status.innerHTML='<span class="err">'+esc(e.message)+'</span>';
  }
}

function filmCardHTML(m){
  const yr=m.release_date?m.release_date.slice(0,4):"Data n.d.";
  const vote=m.vote_average?`<span class="badge">${ICON_STAR}${m.vote_average.toFixed(1)}</span>`:"";
  return `
    <div class="poster" ${m.poster_path?`style="background-image:url(${IMG}w342${m.poster_path})"`:""}>
      ${m.poster_path?"":`<div class="noimg">${esc(m.title)}</div>`}${vote}
    </div>
    <div><div class="t">${esc(m.title)}</div><div class="y">${yr}</div></div>`;
}
function filmCard(m){
  const card=document.createElement("button");
  card.type="button";card.className="card";
  card.innerHTML=filmCardHTML(m);
  card.onclick=()=>openFilm(m.id);
  return card;
}

function renderFilms(list){
  grid.innerHTML="";
  if(!list.length){status.textContent="Nessun film trovato. Prova con il titolo originale o con meno parole.";return;}
  status.textContent=list.length===1?"1 film trovato":list.length+" film trovati";
  list.forEach(m=>grid.appendChild(filmCard(m)));
}

function renderActors(list){
  grid.innerHTML="";
  list=list.filter(p=>p.known_for_department==="Acting");
  if(!list.length){status.textContent="Nessun attore trovato. Controlla l'ortografia del nome.";return;}
  status.textContent=(list.length===1?"1 persona":list.length+" persone")+". Apri una scheda per vedere la filmografia.";
  list.forEach(p=>{
    const known=(p.known_for||[]).map(k=>k.title||k.name).filter(Boolean).slice(0,2).join(", ");
    const card=document.createElement("button");
    card.type="button";card.className="card";
    card.innerHTML=`
      <div class="poster" ${p.profile_path?`style="background-image:url(${IMG}w342${p.profile_path})"`:""}>
        ${p.profile_path?"":`<div class="noimg">${esc(initials(p.name))}</div>`}
      </div>
      <div><div class="t">${esc(p.name)}</div><div class="y">${esc(known||"Attore/attrice")}</div></div>`;
    card.onclick=()=>openActor(p.id,p.name);
    grid.appendChild(card);
  });
}

/* ---------- dettaglio film ---------- */
const backBtn='<button class="back" type="button" onclick="closeOverlay()" aria-label="Chiudi scheda">'+ICON_BACK+'</button>';
const loadingHTML=backBtn+'<div class="hero plain"></div><div class="dbody"><div class="status">Caricamento…</div></div>';
const errorHTML=msg=>backBtn+'<div class="hero plain"></div><div class="dbody"><div class="status"><span class="err">'+esc(msg)+'</span></div></div>';

async function openFilm(id){
  showOverlay(loadingHTML);
  try{
    const m=await api("movie/"+id,{append_to_response:"credits"});
    const yr=m.release_date?m.release_date.slice(0,4):"";
    const reg=(m.credits.crew||[]).filter(c=>c.job==="Director").map(c=>c.name).join(", ");
    const cast=(m.credits.cast||[]).slice(0,15);
    let plot=m.overview;
    if(!plot){ // fallback inglese se la trama IT manca
      try{const en=await apiLang("movie/"+id,"en-US");plot=en.overview;}catch{}
    }
    const facts=[
      yr&&`<span><b>${yr}</b></span>`,
      m.runtime&&`<span>${fmtRuntime(m.runtime)}</span>`,
      m.vote_average&&`<span class="rating">${ICON_STAR}${m.vote_average.toFixed(1)}<span style="color:var(--muted);font-weight:400">/10</span></span>`
    ].filter(Boolean).join("");
    detail.innerHTML=`
      ${backBtn}
      <div class="hero${m.backdrop_path?"":" plain"}" ${m.backdrop_path?`style="background-image:url(${IMG}w1280${m.backdrop_path})"`:""}></div>
      <div class="dhead">
        <div class="poster" ${m.poster_path?`style="background-image:url(${IMG}w500${m.poster_path})"`:""}>
          ${m.poster_path?"":`<div class="noimg">${esc(m.title)}</div>`}
        </div>
        <div class="dinfo">
          <h2>${esc(m.title)}</h2>
          ${m.original_title&&m.original_title!==m.title?`<div class="orig">Titolo originale: ${esc(m.original_title)}</div>`:""}
          ${facts?`<div class="facts">${facts}</div>`:""}
          ${m.genres&&m.genres.length?`<div class="chips">${m.genres.map(g=>`<span class="chip">${esc(g.name)}</span>`).join("")}</div>`:""}
        </div>
      </div>
      <div class="dbody">
        <h3>Trama</h3>
        <p class="plot">${esc(plot||"Trama non disponibile.")}</p>
        ${reg?`<p class="director">Regia di <b>${esc(reg)}</b></p>`:""}
        ${cast.length?`<h3>Cast principale</h3>
        <div class="cast">${cast.map(a=>`
          <button class="actor" type="button" onclick="openActor(${a.id},'${escAttr(a.name)}')">
            <div class="ph" ${a.profile_path?`style="background-image:url(${IMG}w185${a.profile_path})"`:""}>
              ${a.profile_path?"":`<div class="noimg">${esc(initials(a.name))}</div>`}
            </div>
            <div class="an">${esc(a.name)}</div>
            <div class="ac">${esc(a.character||"")}</div>
          </button>`).join("")}</div>`:""}
      </div>`;
    focusBack();
  }catch(e){
    detail.innerHTML=errorHTML(e.message);focusBack();
  }
}

/* ---------- dettaglio attore (filmografia) ---------- */
async function openActor(id,name){
  showOverlay(loadingHTML);
  try{
    const p=await api("person/"+id,{append_to_response:"movie_credits"});
    const films=(p.movie_credits.cast||[])
      .filter(f=>f.poster_path||f.release_date)
      .sort((a,b)=>(b.release_date||"").localeCompare(a.release_date||""));
    // backdrop: il film più popolare in cui ha recitato
    const top=[...films].filter(f=>f.backdrop_path).sort((a,b)=>(b.popularity||0)-(a.popularity||0))[0];
    let bio=p.biography;
    if(!bio){try{const en=await apiLang("person/"+id,"en-US");bio=en.biography;}catch{}}
    const facts=[
      p.birthday&&`<span>Nato/a il <b>${fmtDate(p.birthday)}</b>${p.place_of_birth?" a "+esc(p.place_of_birth):""}</span>`,
      `<span><b>${films.length}</b> film</span>`
    ].filter(Boolean).join("");
    detail.innerHTML=`
      ${backBtn}
      <div class="hero${top?"":" plain"}" ${top?`style="background-image:url(${IMG}w1280${top.backdrop_path})"`:""}></div>
      <div class="dhead">
        <div class="poster round" ${p.profile_path?`style="background-image:url(${IMG}w500${p.profile_path})"`:""}>
          ${p.profile_path?"":`<div class="noimg">${esc(initials(p.name||name))}</div>`}
        </div>
        <div class="dinfo">
          <h2>${esc(p.name||name)}</h2>
          <div class="facts">${facts}</div>
        </div>
      </div>
      <div class="dbody">
        ${bio?`<h3>Biografia</h3><p class="plot">${esc(bio.slice(0,700))}${bio.length>700?"…":""}</p>`:""}
        <h3>Filmografia</h3>
        <div class="grid">${films.map(f=>`
          <button class="card" type="button" onclick="openFilm(${f.id})">${filmCardHTML(f)}</button>`).join("")}</div>
      </div>`;
    focusBack();
  }catch(e){
    detail.innerHTML=errorHTML(e.message);focusBack();
  }
}

async function apiLang(path,lang){
  const u=new URL("https://api.themoviedb.org/3/"+path);
  u.searchParams.set("api_key",apiKey);
  u.searchParams.set("language",lang);
  const r=await fetch(u);return r.json();
}

/* ---------- overlay helpers ---------- */
let lastFocus=null;
function showOverlay(html){
  if(!overlay.classList.contains("open")) lastFocus=document.activeElement;
  detail.innerHTML=html;overlay.classList.add("open");overlay.scrollTop=0;
  document.body.classList.add("locked");
  detail.style.animation="none";void detail.offsetWidth;detail.style.animation="";
}
function closeOverlay(){
  overlay.classList.remove("open");document.body.classList.remove("locked");
  if(lastFocus&&lastFocus.focus) lastFocus.focus();
}
function focusBack(){const b=detail.querySelector(".back");if(b)b.focus({preventScroll:true});}
window.openFilm=openFilm;window.openActor=openActor;window.closeOverlay=closeOverlay;

/* ---------- util ---------- */
function esc(s){return(s==null?"":String(s)).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function escAttr(s){return esc(s).replace(/'/g,"\\&#39;");}
function initials(n){return(n||"?").split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0].toUpperCase()).join("");}
function fmtRuntime(min){const h=Math.floor(min/60),m=min%60;return h?`${h} h ${m?m+" min":""}`.trim():`${m} min`;}
function fmtDate(d){try{return new Date(d+"T00:00:00").toLocaleDateString("it-IT",{day:"numeric",month:"long",year:"numeric"});}catch{return d;}}

/* ---------- setup / chiave ---------- */
function showApp(){setup.style.display="none";bar.style.display="flex";loadTrending();}
function showSetup(){setup.style.display="block";bar.style.display="none";grid.innerHTML="";status.textContent="";$("keyInput").focus();}

$("saveKey").onclick=()=>{
  const k=$("keyInput").value.trim();
  if(!k){$("keyInput").focus();return;}
  apiKey=k;localStorage.setItem(KEY_LS,k);showApp();
};
$("keyInput").addEventListener("keydown",e=>{if(e.key==="Enter")$("saveKey").click();});
$("clearKey").onclick=()=>{
  localStorage.removeItem(KEY_LS);apiKey="";
  $("q").value="";showSetup();
};

/* mode toggle */
function setMode(m){
  mode=m;
  $("mFilm").classList.toggle("on",m==="film");$("mFilm").setAttribute("aria-pressed",m==="film");
  $("mActor").classList.toggle("on",m==="actor");$("mActor").setAttribute("aria-pressed",m==="actor");
  $("q").placeholder=m==="film"?"Cerca un film per titolo":"Cerca un attore per nome";
  if($("q").value) search($("q").value);
  $("q").focus();
}
$("mFilm").onclick=()=>setMode("film");
$("mActor").onclick=()=>setMode("actor");

$("q").addEventListener("input",e=>{clearTimeout(debounce);debounce=setTimeout(()=>search(e.target.value),350);});

/* header: bordo quando si scorre */
const topEl=$("top");
window.addEventListener("scroll",()=>topEl.classList.toggle("scrolled",window.scrollY>4),{passive:true});

/* ---------- PWA: registrazione service worker + install/update UX ---------- */
(function(){
  if (!("serviceWorker" in navigator)) return;

  const installBar = $("installBar");
  const installMsg = $("installMsg");
  const installBtn = $("installBtn");
  const installDismiss = $("installDismiss");
  const updateToast = $("updateToast");
  const updateBtn   = $("updateBtn");

  const DISMISS_LS = "cineteca_install_dismissed";
  const isStandalone = () =>
    window.matchMedia("(display-mode: standalone)").matches ||
    window.navigator.standalone === true;

  const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) && !window.MSStream;

  /* registra il SW (path relativo per girare anche su sotto-cartelle / GH Pages) */
  let refreshing = false;
  navigator.serviceWorker.addEventListener("controllerchange", () => {
    if (refreshing) return; refreshing = true; location.reload();
  });

  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js", { scope: "./" }).then(reg => {
      // controllo aggiornamenti ogni 60min e al focus tab
      const checkUpdate = () => reg.update().catch(()=>{});
      setInterval(checkUpdate, 60 * 60 * 1000);
      window.addEventListener("focus", checkUpdate);

      reg.addEventListener("updatefound", () => {
        const nw = reg.installing;
        if (!nw) return;
        nw.addEventListener("statechange", () => {
          if (nw.state === "installed" && navigator.serviceWorker.controller) {
            updateToast.classList.add("show");
            updateBtn.onclick = () => nw.postMessage({ type: "SKIP_WAITING" });
          }
        });
      });
    }).catch(err => console.warn("SW register failed:", err));
  });

  /* ---------- Install prompt (Android Chrome / Edge / Samsung Internet) ---------- */
  let deferredPrompt = null;

  function dismissed() {
    return localStorage.getItem(DISMISS_LS) === "1";
  }
  function showAndroidInstall() {
    installMsg.innerHTML =
      '<b>Installa Cineteca</b>Aggiungila alla schermata Home e aprila come un\'app.';
    installBtn.style.display = "";
    installBar.classList.add("show");
  }
  function showIOSInstall() {
    installMsg.innerHTML =
      '<b>Installa su iPhone o iPad</b>Tocca <span class="share">' +
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
      '<path d="M12 16V4"/><path d="M8 8l4-4 4 4"/><path d="M4 14v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"/></svg>' +
      '</span> e poi “Aggiungi alla schermata Home”.';
    installBtn.style.display = "none";
    installBar.classList.add("show");
  }

  window.addEventListener("beforeinstallprompt", (e) => {
    e.preventDefault();
    deferredPrompt = e;
    if (!isStandalone() && !dismissed()) showAndroidInstall();
  });

  installBtn.onclick = async () => {
    if (!deferredPrompt) return;
    deferredPrompt.prompt();
    try { await deferredPrompt.userChoice; } catch {}
    deferredPrompt = null;
    installBar.classList.remove("show");
  };

  installDismiss.onclick = () => {
    localStorage.setItem(DISMISS_LS, "1");
    installBar.classList.remove("show");
  };

  window.addEventListener("appinstalled", () => {
    installBar.classList.remove("show");
    deferredPrompt = null;
  });

  /* iOS: nessun beforeinstallprompt, mostriamo l'hint manuale */
  if (isIOS && !isStandalone() && !dismissed()) {
    setTimeout(() => { if (!isStandalone()) showIOSInstall(); }, 1500);
  }
})();

/* ---------- start ---------- */
overlay.addEventListener("click",e=>{if(e.target===overlay)closeOverlay();});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&overlay.classList.contains("open"))closeOverlay();});
if(apiKey) showApp(); else showSetup();
</script>
